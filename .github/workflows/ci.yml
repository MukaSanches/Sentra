name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Sentra.sln

      - name: Build
        run: dotnet build Sentra.sln -c Release --no-restore

      - name: Test
        run: dotnet test Sentra.sln -c Release --no-build --logger "trx;LogFileName=sentra-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentra-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
