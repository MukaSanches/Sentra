name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sentra.sln

      - name: Build
        run: dotnet build Sentra.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Sentra.sln --configuration Release --no-build --verbosity normal
